# Full stack: MongoDB + Node/Express API + React (nginx)
#   docker compose up --build
# App:  http://localhost:8080   (change with WEB_PORT in .env)
services:
  mongo:
    image: mongo:7
    container_name: unifind-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - unifind

  backend:
    build: ./backend
    container_name: unifind-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/unifind
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-deploying}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      UPLOAD_DIR: /app/uploads
      ADMIN_NAME: ${ADMIN_NAME:-UniFind Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@unifind.lk}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - unifind

  frontend:
    build: ./frontend
    container_name: unifind-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - unifind

volumes:
  mongo_data:
  uploads_data:

networks:
  unifind:
